name: Submission

# Validates the submission shape and dispatches the full grader in the
# private repo. Uses pull_request_target so the workflow file from main is
# always used, never the candidate's version of the workflow.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      # Nao fazemos checkout do fork: pull_request_target roda com os secrets
      # do repo base. Buscamos apenas os arquivos de dados via API, que sao
      # lidos/parseados, nunca executados.
      - name: Fetch submission files (data only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p submission
          for f in TEST_EXECUTION.md bugs.yaml TEST_PLAN.md; do
            if gh api "repos/$HEAD_REPO/contents/$f?ref=$HEAD_SHA" \
                 -H "Accept: application/vnd.github.raw" > "submission/$f" 2>/dev/null; then
              echo "fetched $f"
            else
              rm -f "submission/$f"
              echo "could not fetch $f"
            fi
          done

      - name: Validate submission files exist
        id: validate
        run: |
          cd submission
          missing=()
          for f in TEST_EXECUTION.md bugs.yaml TEST_PLAN.md; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required files: ${missing[*]}"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "reason=Missing: ${missing[*]}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Validate YAML syntax of bugs.yaml
        if: steps.validate.outputs.valid == 'true'
        run: |
          cd submission
          python3 -c "
          import sys, yaml
          try:
              with open('bugs.yaml') as fh:
                  data = yaml.safe_load(fh)
              if isinstance(data, list):
                  bugs = data
              elif isinstance(data, dict) and isinstance(data.get('bugs'), list):
                  bugs = data['bugs']
              else:
                  raise ValueError('expected a list of bugs or an object containing a bugs list')
              if not all(isinstance(bug, dict) for bug in bugs):
                  raise ValueError('every bug entry must be an object')
              print(f'bugs.yaml parsed OK ({len(bugs)} bug(s) reported)')
          except Exception as e:
              print(f'::error::bugs.yaml is not valid YAML: {e}')
              sys.exit(1)
          "

      - name: Count filled TCs
        if: steps.validate.outputs.valid == 'true'
        id: tcs
        run: |
          cd submission
          filled=$(grep -cE '^\|[[:space:]]*TC-[A-Z]+-[0-9]+[[:space:]]*\|.*\|[[:space:]]*(PASS|FAIL|BLOCKED)([^[:alnum:]_|]|[[:space:]])*\|' TEST_EXECUTION.md || true)
          total=$(grep -cE '^\|\s*TC-[A-Z]+-[0-9]+\s*\|' TEST_EXECUTION.md || true)
          echo "filled=$filled" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Filled $filled / $total test cases"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          VALID: ${{ steps.validate.outputs.valid }}
          REASON: ${{ steps.validate.outputs.reason }}
          FILLED: ${{ steps.tcs.outputs.filled }}
          TOTAL: ${{ steps.tcs.outputs.total }}
        with:
          script: |
            const valid = process.env.VALID === 'true';
            const body = valid
              ? `## ✅ Submission validated\n\n` +
                `- Required files present: TEST_EXECUTION.md, bugs.yaml, TEST_PLAN.md\n` +
                `- Test cases filled: **${process.env.FILLED} / ${process.env.TOTAL}**\n\n` +
                `Full grading is running in the recruiter's pipeline. ` +
                `You will not see the score in this PR — the recruiter will reach out after review.`
              : `## ❌ Submission has problems\n\n` +
                `${process.env.REASON || 'Check the workflow logs for details.'}\n\n` +
                `Please fix and push again to the same branch.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Dispatch grader (private repo)
        if: steps.validate.outputs.valid == 'true'
        env:
          PAT: ${{ secrets.GRADER_DISPATCH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SUB_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SUB_SHA: ${{ github.event.pull_request.head.sha }}
          SUB_BRANCH: ${{ github.event.pull_request.head.ref }}
          CANDIDATE: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::GRADER_DISPATCH_PAT not configured — grader will not run automatically."
            exit 0
          fi
          # Payload montado com jq a partir de env vars: valores controlados
          # pelo candidato (branch, login) nunca sao interpolados no script.
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg submission_repo "$SUB_REPO" \
            --arg submission_sha "$SUB_SHA" \
            --arg submission_branch "$SUB_BRANCH" \
            --arg candidate_login "$CANDIDATE" \
            '{event_type: "candidate-submission", client_payload: {
                pr_number: $pr_number,
                pr_url: $pr_url,
                submission_repo: $submission_repo,
                submission_sha: $submission_sha,
                submission_branch: $submission_branch,
                candidate_login: $candidate_login
             }}' \
          | curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Cadastra-Next-Gen-Company/avaliacao-qa/dispatches \
              -d @-
